  coder-30b-190k:
    service: llama-code-30b-190k.service
    port: 8082
    health_endpoint: /health
    vram_mb: 22000
    args: ["--model", "/home/servidor/Modelos/Qwen3-Coder/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf", "-c", "190000", "-np", "1", "--ctx-size", "190000", "--rope-scaling", "yarn", "--yarn-orig-ctx", "32768", "-ctk", "q4_0", "-ctv", "q4_0", "-ngl", "99", "-np", "1", "--kv-unified", "--no-kv-offload", "--flash-attn", "on", "--jinja", "--chat-template-file", "/home/servidor/Descargas/model-router/templates/qwen25-coder-tools.jinja", "--alias", "local-template"]
  coder-q5-65k:
    service: llama-code-q5.service
    port: 8082
    health_endpoint: /health
    vram_mb: 18000
    args: ["--model", "/models/coder-q5.gguf", "-c", "65536", "-np", "1", "--ctx-size", "65536"]
  wan-14b:
    service: wan-video.service
    port: 8189
    health_endpoint: /health
    vram_mb: 20000
    args: ["--host", "127.0.0.1", "--port", "8189"]
  wan-i2v-14b:
    service: wan-i2v.service
    port: 8191
    health_endpoint: /health
    vram_mb: 20000
    args: ["--host", "127.0.0.1", "--port", "8191"]
  echomimic-v2:
    service: echomimic.service
    port: 8192
    health_endpoint: /health
    vram_mb: 8000
    args: ["--host", "127.0.0.1", "--port", "8192"]
  sdxl:
    service: sdxl.service
    port: 8188
    health_endpoint: /system_stats
    vram_mb: 6500
    args: ["--listen", "127.0.0.1", "--port", "8188"]
defaults:
  model: coder-30b-a3b
  idle_timeout_seconds: 600
  swap_timeout_seconds: 240
  health_interval_seconds: 2
  bind: "127.0.0.1:8000"
