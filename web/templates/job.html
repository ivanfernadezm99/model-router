<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job {{ job_id[:8] }} — Model Router</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root { --bg:#0a0a0f; --bg-card:#12121a; --fg:#e0e0e0; --muted:#888; --accent:#00d4aa; --err:#ff5f57; --ok:#00e676; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,sans-serif; }
    body { background:var(--bg); color:var(--fg); min-height:100vh; padding:20px; max-width:900px; margin:0 auto; line-height:1.5; }
    h1 { color:var(--accent); margin-bottom:4px; font-size:1.3em; }
    .card { background:var(--bg-card); border-radius:8px; padding:15px; margin-bottom:15px; border:1px solid #2a2a3a; }
    .muted { color:var(--muted); font-size:.85em; }
    .small { font-size:.85em; }
    .ok { color:var(--ok); } .err { color:var(--err); }
    .btn { padding:8px 14px; border:1px solid #3a3a4a; border-radius:4px; cursor:pointer; font-weight:600; background:#1a1a2a; color:var(--fg); text-decoration:none; display:inline-block; }
    .btn.primary { background:var(--accent); color:#000; border-color:var(--accent); }
    .media-preview { max-width:100%; max-height:420px; border-radius:6px; margin-top:10px; border:1px solid #2a2a3a; display:block; }
    video.media-preview { max-height:480px; }
    pre { background:#0d0d1a; padding:10px; border-radius:4px; overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
    #raw { margin-top:10px; }
  </style>
</head>
<body>
  <h1>Job {{ job_id[:8] }}...</h1>
  <p class="muted small">ID completo: {{ job_id }} — <a href="/" style="color:var(--accent)">← volver al inicio</a> · <a href="/api/job/{{ job_id }}" style="color:var(--accent)">JSON</a> · <a href="http://127.0.0.1:8000/jobs/{{ job_id }}" style="color:var(--accent)" target="_blank">Gateway</a></p>

  <div class="card" id="info">Cargando...</div>
  <div class="card" id="preview" style="display:none"></div>
  <div class="card">
    <h3 style="margin-bottom:8px">Raw JSON</h3>
    <pre id="raw">cargando...</pre>
  </div>

  <script>
    const jobId = "{{ job_id }}";
    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function isVid(n){ return /\.(mp4|webm|mov)$/i.test(n||''); }
    async function load(){
      try{
        const r = await fetch('/api/job/' + encodeURIComponent(jobId));
        const d = await r.json();
        document.getElementById('raw').textContent = JSON.stringify(d, null, 2);
        if(!r.ok){ document.getElementById('info').innerHTML = '<span class="err">Error: '+(d.error||r.status)+'</span>'; return; }
        const st = d.status||'?';
        const payload = d.payload||{};
        const result = d.result||{};
        const target = result.target||payload.target||'?';
        let html = '<strong>Estado:</strong> '+(st==='completed'?'<span class="ok">completed</span>': st==='failed'?'<span class="err">failed</span>':esc(st))+' <span class="muted">('+esc(d.created_at||'')+' → '+esc(d.updated_at||'')+')</span><br>';
        html += '<strong>Target:</strong> '+esc(target)+'<br>';
        html += '<strong>Prompt:</strong> '+esc(payload.prompt||result.payload&&result.payload.prompt||'')+'<br>';
        if(d.error) html += '<span class="err"><strong>Error:</strong> '+esc(d.error)+'</span><br>';
        if(result.backend_error) html += '<span class="err"><strong>Backend error:</strong> '+esc(result.backend_error)+'</span><br>';
        const file = result.file|| (result.payload&&result.payload.file) || '';
        if(file){
          html += '<strong>Archivo:</strong> '+esc(file)+'<br>';
          const fname = file.split('/').pop();
          const url = '/api/jobs/' + encodeURIComponent(jobId) + '/result';
          const actions = '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'
            + '<a class="btn primary" href="'+url+'" download="'+esc(fname)+'">⬇️ Descargar</a>'
            + '<a class="btn" href="'+url+'" target="_blank">🔗 Abrir</a>'
            + '</div>';
          html += actions;
          document.getElementById('preview').style.display='block';
          document.getElementById('preview').innerHTML = '<h3>Preview</h3>' + (isVid(fname) ? '<video class="media-preview" src="'+url+'" controls autoplay muted playsinline></video>' : '<img class="media-preview" src="'+url+'" />') + '<p class="muted small" style="margin-top:6px">'+esc(fname)+'</p>';
        } else if(st==='completed'){
          html += '<span class="muted">Sin archivo generado (backend no devolvió file).</span>';
        }
        // disco grande
        html += '<br><span class="muted small">Disco salida: /media/servidor/d0a196c3-2d36-4431-b15d-8ea078ad8222/model-router-output — API: /api/jobs/'+esc(jobId)+'/result</span>';
        document.getElementById('info').innerHTML = html;
      }catch(e){
        document.getElementById('info').innerHTML = '<span class="err">Failed to fetch: '+esc(e.message)+'</span>';
        document.getElementById('raw').textContent = String(e);
      }
    }
    load();
    setInterval(()=>{ fetch('/api/job/'+encodeURIComponent(jobId)).then(r=>r.json()).then(d=>{ if(d.status==='completed'||d.status==='failed') location.reload(); }).catch(()=>{}); }, 5000);
  </script>
</body>
</html>
